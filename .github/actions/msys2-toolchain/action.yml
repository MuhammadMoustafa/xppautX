name: MSYS2 toolchain (cached)
description: >-
  Sets up an MSYS2 toolchain (e.g. UCRT64 or CLANG64) plus make and python.

  Caches the installed environment tree as a single 7z archive
  (%RUNNER_TEMP%\msys2-<env>.7z), keyed on the given packages file, and
  restores it with 7-Zip instead of through actions/cache's own directory
  caching. actions/cache always tars a directory path before handing it to
  the runner's tar.exe for extraction, and on this repo's toolchain trees
  (tens of thousands of small files) that per-file extraction took over two
  minutes even on a cache hit (W41, run 36284059453) -- most of the ~170s
  this was meant to remove. A single 7z file only needs one file written by
  actions/cache's own restore, and 7-Zip's own extraction (native Win32 file
  APIs, not tar.exe's per-file syscalls under Git for Windows) is far faster
  for a tree this shape. Bump the packages file's version line to force a
  fresh install (a package bump, say).
inputs:
  msystem:
    description: "MSYS2 environment (e.g. UCRT64, CLANG64)"
    required: true
  packages-file:
    description: "Packages file keyed for caching (e.g. .github/msys2-ucrt64-packages.txt)"
    required: true
runs:
  using: composite
  steps:
    # the month is in the key: the release installs MSYS2's newest packages
    # each time (release.yml), so the cached toolchain is refreshed monthly
    # and CI builds with the release's compiler within a month of it (W382)
    - name: This month, for the cache key
      id: month
      shell: pwsh
      run: '"value=$(Get-Date -Format yyyy-MM)" >> $env:GITHUB_OUTPUT'
    - name: Restore cached MSYS2 ${{ inputs.msystem }} toolchain (single 7z archive)
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}\msys2-${{ inputs.msystem }}.7z
        key: msys2-${{ inputs.msystem }}-toolchain-${{ steps.month.outputs.value }}-${{ hashFiles(inputs.packages-file) }}
    # release: false in both: the runner's preinstalled MSYS2 at C:\msys64
    # is the tree clang64 / ucrt64 sits under either way (the default installs a
    # fresh MSYS2 under the runner's temp folder instead). cache: false in
    # both: the 7z archive is the one toolchain cache; setup-msys2's own
    # package cache (on by default) only duplicated it, and every parallel
    # job on a hit raced to save the same key ("Unable to reserve cache").
    - name: "MSYS2 shell (cache hit): no packages installed here, extracted below"
      if: steps.cache.outputs.cache-hit == 'true'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ inputs.msystem }}
        release: false
        update: false
        cache: false
    - name: Extract the cached ${{ inputs.msystem }} tree with 7-Zip
      if: steps.cache.outputs.cache-hit == 'true'
      shell: pwsh
      run: |
        $dir = "${{ inputs.msystem }}".ToLower()
        New-Item -ItemType Directory -Force -Path "C:\msys64\$dir" | Out-Null
        Set-Location "C:\msys64\$dir"
        & "$env:ProgramFiles\7-Zip\7z.exe" x "${{ runner.temp }}\msys2-${{ inputs.msystem }}.7z" -y -bd
        if ($LASTEXITCODE -ne 0) { throw "7z extract failed: $LASTEXITCODE" }
    - name: MSYS2 shell and toolchain (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ inputs.msystem }}
        release: false
        update: false
        cache: false
        pacboy: >-
          toolchain:p
          make:p
          python:p
    - name: Archive the installed ${{ inputs.msystem }} tree for the cache (cache miss)
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $dir = "${{ inputs.msystem }}".ToLower()
        Set-Location "C:\msys64\$dir"
        & "$env:ProgramFiles\7-Zip\7z.exe" a -mx=1 -mmt=on "${{ runner.temp }}\msys2-${{ inputs.msystem }}.7z" *
        if ($LASTEXITCODE -ne 0) { throw "7z archive failed: $LASTEXITCODE" }
