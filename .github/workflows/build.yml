name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Build, smoke test, metrics
        run: tools/verify.sh
      - name: Coupling metric
        run: |
          tools/coredeps.sh -v
          test "$(tools/coredeps.sh | grep -oE 'imports: [0-9]+' | grep -oE '[0-9]+')" -eq 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Web front end screenshots (every step must run; HEAD against the build)"
        run: node tools/webshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webshots
          path: build/webshots/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install libx11
      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" xppaut xppcore-cli xppcore-server xppaut-web X11_INC="-I$(brew --prefix)/include" X11_LIB="-L$(brew --prefix)/lib" 2>&1 | tee build.log
      - name: Smoke test (headless, both binaries must agree)
        run: |
          ./xppaut -version
          cd /tmp && "$GITHUB_WORKSPACE/xppaut" "$GITHUB_WORKSPACE/examples/ode/lecar.ode" -silent
          test "$(wc -l < output.dat)" -eq 601
          mv output.dat x11.dat && "$GITHUB_WORKSPACE/xppcore-cli" "$GITHUB_WORKSPACE/examples/ode/lecar.ode"
          cmp x11.dat output.dat
          echo "md5 on this platform: $(md5 -q output.dat) (linux baseline c281851de59ffd03b2a46428619a0c8f)"
      - name: Server protocol and web front end
        run: python3 tools/servercheck.py && python3 tools/webcheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: xppaut-macos
          path: |
            xppcore-server
            xppaut-web

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - name: Build the X11-free binaries natively
        run: make -j4 server cli web
      - name: Headless run matches Linux (ignoring line ends)
        run: |
          cd /tmp && "$GITHUB_WORKSPACE/xppcore-cli.exe" "$GITHUB_WORKSPACE/examples/ode/lecar.ode"
          test "$(tr -d '\r' < output.dat | md5sum | cut -d' ' -f1)" = c281851de59ffd03b2a46428619a0c8f
      - name: Server protocol and web front end
        run: python tools/servercheck.py --server ./xppcore-server.exe && python tools/webcheck.py --bin ./xppaut-web.exe
      - uses: actions/upload-artifact@v4
        with:
          name: xppaut-windows
          path: |
            xppcore-server.exe
            xppaut-web.exe
