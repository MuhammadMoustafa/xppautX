name: build

on:
  push:
    branches: [master, 'ci/**']
    # a push that changes only documentation starts no run (maintainer,
    # 2026-10-03); the Markdown a check reads still does: docs/manual/
    # (built into web2's page, manualcheck) and docs/protocol.md (servercheck)
    paths:
      - '**'
      - '!**/*.md'
      - 'docs/manual/**'
      - 'docs/protocol.md'
  pull_request:
  # run only some jobs on a commit already pushed (a fix pushed with [skip ci]:
  # maintainer, 2026-10-01, rerun only what failed): gh workflow run build.yml
  # --ref master -f jobs=macos-ui,windows-clang. Empty runs every job.
  workflow_dispatch:
    inputs:
      jobs:
        description: 'comma-separated job names to run (empty: all)'
        required: false
        default: ''

# A newer push to a branch cancels that branch's run still going (maintainer,
# 2026-10-01: three pushes minutes apart ran three full runs): the newest
# run checks the tip, which holds every commit the cancelled ones had. A
# push and a workflow_dispatch are in different groups, so a dispatch of a
# few jobs never cancels a push's full run, nor the other way round.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# The Linux jobs run on ubuntu-26.04, named rather than ubuntu-latest
# (maintainer, 2026-10-01): ubuntu-latest moves to 26.04 over Oct 19 -
# Nov 19, 2026, and a runner that changes under us mid-wave would read as
# a failure of the wave. The release is built on 26.04 too (release.yml);
# an older system builds from source with tools/build_linux.sh.

# Each platform runs the same behaviour checks against its own build
# (build, unit tests, protocol, web, command-line modes, autoX, every
# example, the browser checks); the checks about the source, the same
# everywhere, run once in `source` (W17). Every job runs in parallel: the
# wall time is the longest job's. Jobs are named for what they test: a
# platform's `-core` job (build, unit tests, protocol, modes, autoX,
# examples), its `-ui` job (the front end in a headless browser),
# `linux-sanitizers`, `macos-sanitizers` and `windows-clang-sanitizers`
# (the last two without LeakSanitizer, unsupported on Apple Silicon
# runners and on Windows), and `source`.
#
# Every check runs even when an earlier check of its job failed (W18), so
# one run reports every failure (and still uploads the examples' md5s);
# the job still fails if any step did. Setup steps (checkout, toolchain,
# build) keep the default condition: a failed build stops its job's
# checks, which test the build (`steps.build.outcome`).
# W716: only master saves compiler caches. A ci/** branch and a pull request
# restore master's (restore-keys reach the default branch's caches) and add
# none, so a spike's pushes never evict them from the repository's 10 GB; to
# test the saving on a branch, temporarily set this to true.
env:
  CCACHE_SAVE: ${{ github.ref == 'refs/heads/master' }}

# actions: write lets .github/actions/ccache-save delete the job's older caches
permissions:
  contents: read
  actions: write

jobs:
  # the source, not a build (W722: three jobs, so the two builds below run
  # beside the rules and the web checks): encoding, script modes, stdoutcheck,
  # formatcheck and every other check that reads the source
  # (tools/sourcecheck.sh --only rules; tools/verify.sh runs all three parts
  # locally), and web2's dist/ built from src/, types and unit tests. No
  # warning count: every build here passes -Werror with the flags the count
  # used (W722), so linux-core's build already refuses what it would list.
  source:
    name: Source - rules, types and web unit tests
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',source,')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: 24
      - name: "Source checks: encoding, script modes, stdout, formats, options, duplication, aliases, CSS, manual"
        run: tools/sourcecheck.sh --only rules
      - name: "New front end: dist/ built from src/, types, unit tests"
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: cd web2 && npm ci && npm run check && npm run typecheck && npm test

  # the LTO link of the whole program: no extern whose type differs from its definition, and the option schema against that program (tools/sourcecheck.sh --only lto)
  source-lto:
    name: Source - LTO type check
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',source-lto,')
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # source-lto: 246 compiles, 130M in run 43534556462 (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 300M
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      # WebKitGTK: the build compiles the same sources as linux-core's,
      # the window's included
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache WebKitGTK apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-v1
          restore-keys: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-
      - name: WebKitGTK for the desktop window
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" libwebkit2gtk-4.1-dev ccache
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-source-lto-gcc-
      - name: "LTO type check and option schema"
        run: tools/sourcecheck.sh --only lto
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      # saved even when a check failed or the run was cancelled: the objects the build made are good either way
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-source-lto-gcc-

  # the dead-code link at -O0, and the global state check on its objects (tools/sourcecheck.sh --only deadcode)
  source-deadcode:
    name: Source - dead code and global state
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',source-deadcode,')
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # source-deadcode: 326 compiles, 50M in run 43534556462 (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 200M
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      # WebKitGTK: the build compiles the same sources as linux-core's,
      # the window's included
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache WebKitGTK apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-v1
          restore-keys: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-
      - name: WebKitGTK for the desktop window
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" libwebkit2gtk-4.1-dev ccache
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-source-deadcode-gcc-
      - name: "Dead code and global state"
        run: tools/sourcecheck.sh --only deadcode
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      # saved even when a check failed or the run was cancelled: the objects the build made are good either way
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-source-deadcode-gcc-

  linux-core:
    name: Linux - GCC core and numerical baselines
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',linux-core,')
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # linux-core: 325 compiles, 123 cleanups at 400M in run 43154967684; gcc -g objects about 2 MB each (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 1000M
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      # the packages WebKitGTK pulls in (libsoup, gstreamer, ...) are the
      # bulk of this install; caching them cuts it to a dpkg unpack
      # the runner image (ubuntu24, ubuntu26 ...) in the cache's key: ImageOS is
      # an environment variable of the runner, not in the workflow's env context
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache WebKitGTK apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-v1
          restore-keys: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-
      # the Linux window (W13e): built into its embedded library, which
      # tools/modecheck.sh loads (no display: then the browser)
      - name: WebKitGTK for the desktop window
        # apt downloads into ~/apt-cache (the runner's user can restore a cache
        # there, not into /var/cache/apt), then leaves it readable for the save
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" libwebkit2gtk-4.1-dev ccache
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-linux-core-gcc-
      # everything verify.sh checks but the source checks (the source job's);
      # one step: verify.sh runs every check itself and reports each
      - name: Build, smoke test, protocol, modes, autoX, examples, metrics
        run: |
          # the machine the numerics ran on: a golden or md5 difference
          # between runners is read against it (W159)
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 -o -w -E 'fma|avx2|avx512f' /proc/cpuinfo | sort -u | paste -sd ' '
          gcc --version | head -1; ldd --version | head -1
          # what gcc targets and any flags the image sets: W159 could not
          # find why this runner's build fused a*b+c into FMAs
          gcc -Q --help=target | grep -m1 -- '-march='
          echo "CFLAGS=${CFLAGS-} CXXFLAGS=${CXXFLAGS-} MAKEFLAGS=${MAKEFLAGS-}"
          tools/verify.sh --no-source-checks
      - name: Every example with the interpreter (same baseline)
        if: ${{ !cancelled() }}
        run: tools/examples_check.sh --interpreted
      # a golden output that differs, for reading beside tests/golden (W159)
      - name: Upload the differing golden outputs
        if: ${{ !cancelled() && hashFiles('build/golden-differ/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: golden-differ-linux
          retention-days: 14
          path: build/golden-differ/
      - name: Upload the differing autoX diagrams
        if: ${{ !cancelled() && hashFiles('build/auto-differ/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: auto-diagrams-linux
          retention-days: 30
          path: build/auto-differ/
      # strip the CI artifact only (verify.sh above already ran against
      # the -g build; the window's embedded library is already stripped
      # at link time, -Wl,-s, so this does not touch it twice)
      - name: Strip the CI artifact
        run: strip xppautX
      # Artifacts keep 14 days (programs, sanitizer reports), 30 for
      # examples-md5-* (committed as platform baselines): W44, the 90-day
      # default grew the list by ~4 MB a push
      - uses: actions/upload-artifact@v7
        with:
          name: xppautX-linux
          retention-days: 14
          path: xppautX
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      # saved even when a check failed or the run was cancelled: the objects the build made are good either way
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-linux-core-gcc-

  # The new front end driven through a headless browser (docs/ui-v2.md):
  # its own job beside linux-core's verify.sh, so the two run in parallel
  # instead of one after the other (97 s on top of verify's own time).
  # Needs its own build (plain, not the whole verify.sh) and the same
  # WebKitGTK window the checks in verify.sh's build already carry.
  linux-ui:
    name: Linux - GCC browser UI
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',linux-ui,')
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # linux-ui restores linux-core's cache and saves none: the cap keeps the restored objects (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 1000M
    steps:
      - uses: actions/checkout@v7
        # the release tags: git describe gives the build the version the
        # update check compares (v0.1.0-N-gHASH), not a bare commit hash
        with:
          fetch-depth: 0
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache WebKitGTK apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-v1
          restore-keys: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-
      - name: WebKitGTK for the desktop window
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" libwebkit2gtk-4.1-dev ccache
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-linux-core-gcc-
      - name: Build xppautX
        id: build
        run: make -j"$(nproc)" xppautx
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: "New front end in a browser (store and plot state)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/web2check.mjs
      - name: "UI workflow and no-model startup in a browser"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/uiworkflowcheck.mjs ./xppautX && node tools/startupcheck.mjs ./xppautX
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats

  # AddressSanitizer, LeakSanitizer and UBSan over the same checks, in
  # parallel with the jobs above (it takes a few minutes); one step:
  # asancheck.sh builds and runs every check itself
  linux-sanitizers:
    name: Linux - GCC sanitizers with leaks - ${{ matrix.shard }}
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',linux-sanitizers,')
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # linux-sanitizers: 241-321 compiles per shard, 39-49 cleanups at 600M (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 900M
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: smoke-examples-unit
            only: build,smoke,examples,unittests
          - shard: protocol-and-web
            only: build,servercheck,webcheck
          - shard: auto-1-of-3
            only: build,autoxcheck-shard=1/3
          - shard: auto-2-of-3
            only: build,autoxcheck-shard=2/3
          - shard: auto-3-of-3
            only: build,autoxcheck-shard=3/3
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      - name: ccache
        run: sudo apt-get update && sudo apt-get install -y ccache
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-linux-asan-gcc-
      # gcc's ASan cannot map its shadow memory with the 32 bits of mmap
      # randomness recent runner kernels use
      - name: Allow ASan's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: "Sanitizers: no error or leak report (${{ matrix.shard }})"
        run: tools/asancheck.sh --only '${{ matrix.only }}'
      - name: Upload sanitizer reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: asan-reports-linux-${{ matrix.shard }}
          retention-days: 14
          path: build/asan/reports
          if-no-files-found: ignore
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      # saved even when a check failed or the run was cancelled: the objects the build made are good either way
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() && matrix.shard == 'smoke-examples-unit' }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-linux-asan-gcc-

  # AddressSanitizer + UBSan (Apple clang) over the same checks as
  # linux-sanitizers, without LeakSanitizer: unsupported on Apple Silicon
  # runners (asancheck.sh --no-leaks turns off ASAN_OPTIONS'
  # detect_leaks).
  macos-sanitizers:
    name: macOS - clang sanitizers
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',macos-sanitizers,')
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # macos-sanitizers: 2 cleanups at 600M, so a little room (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 700M
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      - name: ccache
        run: brew install ccache
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-macos-asan-clang-
      - name: "Sanitizers: no error report (no leak detection on macOS)"
        run: tools/asancheck.sh --no-leaks
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      # saved even when a check failed or the run was cancelled: the objects the build made are good either way
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-macos-asan-clang-
      - name: Upload sanitizer reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: asan-reports-macos
          retention-days: 14
          path: build/asan/reports
          if-no-files-found: ignore

  macos-core:
    name: macOS - clang core and numerical baselines
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',macos-core,')
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # macos-core: 2 cleanups at 400M, so a little room (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      - name: ccache
        run: brew install ccache
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-macos-core-clang-
      - name: "Build xppautX (WKWebView window on, the Darwin default since W13d)"
        id: build
        run: |
          make -j"$(sysctl -n hw.ncpu)" xppautx
          ./xppautX --help | head -5
      - name: "Unit tests (one program, linked with clang++)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make test
      - name: Smoke test (headless)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd /tmp && "$GITHUB_WORKSPACE/xppautX" "$GITHUB_WORKSPACE/examples/ode/lecar.odex" --silent
          test "$(wc -l < output.dat)" -eq 601
          echo "md5 on this platform: $(md5 -q output.dat) (linux baseline 58fed7a175a635010b7698da91dc4e4c)"
          # the md5 is the same interpreted or compiled: the log says MIR compiled the model (W714)
          "$GITHUB_WORKSPACE/xppautX" "$GITHUB_WORKSPACE/examples/ode/lecar.odex" --silent --verbose 2>&1 | grep "Compiled 11 of 11 programs"
      - name: Command-line modes (--help, --browser, --no-open)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh tools/modecheck.sh
      # W91: Finder hands xppautX.app a file as an open-documents Apple
      # Event, not an argument, and `open -a` sends the same event. The app
      # logs the file the event named (--verbose: INFO), then the parser's
      # stats once that model has loaded; the window runs in the runner's
      # own desktop session.
      - name: "xppautX.app loads the model it is opened with (open -a, as Finder)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          make app
          log="$RUNNER_TEMP/app.log"
          : > "$log"
          open -n -a "$PWD/xppautX.app" --stderr "$log" "$PWD/examples/ode/lecar.odex" --args --verbose
          i=0
          while [ $i -lt 60 ] && ! grep -q 'Used [0-9]* constants' "$log"; do sleep 1; i=$((i + 1)); done
          pkill -f 'xppautX.app/Contents/MacOS/xppautX' || true
          tail -n 20 "$log"
          grep -q 'macOS asked to open .*/examples/ode/lecar.odex' "$log" && grep -q 'Used [0-9]* constants' "$log"
      # The checks of one binary that touch disjoint parts of it run side by side
      # (tools/side_by_side.sh, W694: a log each, the verdicts at the end, the job
      # fails if any did): the protocol and the front end over HTTP, autoX, every
      # example against tests/examples.md5 (one baseline for every platform, W235;
      # a crash or timeout fails too) and autoX's diagrams against the shared
      # numerical baseline (1 and auto threads, W299). The artifacts below read
      # the files they leave, not a step's outcome.
      - name: "Protocol, web, autoX, every example and autoX diagrams (run side by side)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          tools/side_by_side.sh --prefix build/check- \
            servercheck uv run --locked python tools/servercheck.py -- \
            steadycheck uv run --locked python tools/steadycheck.py -- \
            spikecheck uv run --locked python tools/spikecheck.py -- \
            livestatecheck uv run --locked python tools/livestatecheck.py -- \
            webcheck uv run --locked python tools/webcheck.py -- \
            autoxcheck uv run --locked python tools/autoxcheck.py -- \
            examples tools/examples_check.sh --write examples.macos.md5 --keep examples-differ -- \
            autoxcompare uv run --locked python tools/autoxcompare.py --server ./xppautX --keep auto-differ
      # what this run computed, kept as an artifact when a model differs
      - name: Upload the examples' md5s (only when a model differs from the baseline)
        if: ${{ !cancelled() && hashFiles('examples-differ/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: examples-md5-macos
          retention-days: 30
          path: |
            examples.macos.md5
            examples-differ/
          if-no-files-found: ignore
      - name: Upload the differing autoX diagrams
        if: ${{ !cancelled() && hashFiles('auto-differ/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: auto-diagrams-macos
          retention-days: 30
          path: auto-differ/
      - name: "Strip the CI artifact (-x: macOS keeps a minimal symbol table)"
        run: strip -x xppautX
      - uses: actions/upload-artifact@v7
        with:
          name: xppautX-macos
          retention-days: 14
          path: xppautX
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      # saved even when a check failed or the run was cancelled: the objects the build made are good either way
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-macos-core-clang-

  # web2check against the macOS build, beside macos-core (as linux-ui and
  # windows-ui are beside theirs): its own build, the runner's Google
  # Chrome (tools/cdp.mjs findBrowser: /Applications/Google Chrome.app)
  macos-ui:
    name: macOS - clang browser UI
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',macos-ui,')
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # macos-ui restores macos-core's cache and saves none (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v7
        # the release tags: git describe gives the build the version the
        # update check compares (v0.1.0-N-gHASH), not a bare commit hash
        with:
          fetch-depth: 0
      - name: ccache
        run: brew install ccache
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-macos-core-clang-
      - name: Build xppautX
        id: build
        run: make -j"$(sysctl -n hw.ncpu)" xppautx
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: "New front end in a browser (store and plot state)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/web2check.mjs
      - name: "UI workflow and no-model startup in a browser"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/uiworkflowcheck.mjs ./xppautX && node tools/startupcheck.mjs ./xppautX
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats

  windows-core:
    name: Windows - GCC UCRT core and numerical baselines
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',windows-core,')
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # windows-core: 323 compiles, 62 cleanups at 400M (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 800M
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      - uses: ./.github/actions/msys2-toolchain
        with:
          msystem: UCRT64
          packages-file: .github/msys2-ucrt64-packages.txt
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-windows-ucrt-gcc-
      - name: Build the X11-free binaries natively
        id: build
        run: mingw32-make -j4 xppautx
      - name: "Unit tests (one program, linked with g++)"
        id: unittests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mingw32-make -j4 test
      # a crash of the unit-test program (exit above 1: a failing test exits 1)
      # is run again under gdb for its backtrace
      - name: Backtrace of a crashed unit test
        if: ${{ !cancelled() && steps.unittests.outcome == 'failure' }}
        run: |
          t=build/obj/tests/test_all.exe
          st=0; "./$t" > /dev/null 2>&1 || st=$?
          if [ "$st" -gt 1 ]; then
            echo "== $t exited $st"
            gdb -batch -ex run -ex bt -ex quit "./$t" 2>&1 | tail -40
          fi
      - name: Headless run matches Linux (ignoring line ends)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          top=$PWD
          cd "$(mktemp -d)" && "$top/xppautX.exe" "$top/examples/ode/lecar.odex" --silent
          test "$(tr -d '\r' < output.dat | md5sum | cut -d' ' -f1)" = 58fed7a175a635010b7698da91dc4e4c
          "$top/xppautX.exe" "$top/examples/ode/lecar.odex" --silent --verbose 2>&1 | grep "Compiled 11 of 11 programs"
      - name: "Command-line modes (--help, --no-open; --browser's ShellExecute skipped)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh tools/modecheck.sh xppautX.exe
      # The checks of one binary that touch disjoint parts of it run side by side
      # (tools/side_by_side.sh, W694: a log each, the verdicts at the end, the job
      # fails if any did): the protocol and the front end over HTTP, autoX, every
      # example (Linux's tests/examples.md5, no baseline of its own since W159: the
      # numbers are the same on every CPU and system, xpp::math; a crash, a timeout
      # or a differing md5 fails; output.dat's CRs are removed before hashing) and
      # autoX's diagrams against the shared numerical baseline (1 and auto
      # threads, W299). The artifacts below read the files they leave, not a
      # step's outcome.
      - name: "Protocol, web, autoX, every example and autoX diagrams (run side by side)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bin=./xppautX.exe
          tools/side_by_side.sh --prefix build/check- \
            servercheck uv run --locked python tools/servercheck.py --server "$bin" -- \
            steadycheck uv run --locked python tools/steadycheck.py --server "$bin" -- \
            spikecheck uv run --locked python tools/spikecheck.py --server "$bin" -- \
            livestatecheck uv run --locked python tools/livestatecheck.py --server "$bin" -- \
            webcheck uv run --locked python tools/webcheck.py --bin "$bin" -- \
            autoxcheck uv run --locked python tools/autoxcheck.py --server "$bin" -- \
            examples tools/examples_check.sh --bin "$bin" --write examples.windows.md5 --keep examples-differ -- \
            autoxcompare uv run --locked python tools/autoxcompare.py --server "$bin" --keep auto-differ
      # what this run computed, for reading a difference
      - name: Upload the examples' md5s (only when a model differs from the baseline)
        if: ${{ !cancelled() && hashFiles('examples-differ/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: examples-md5-windows
          retention-days: 30
          path: |
            examples.windows.md5
            examples-differ/
          if-no-files-found: ignore
      - name: Upload the differing autoX diagrams
        if: ${{ !cancelled() && hashFiles('auto-differ/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: auto-diagrams-windows
          retention-days: 30
          path: auto-differ/
      - name: Strip the CI artifact (local/-g builds are untouched)
        run: strip xppautX.exe
      - uses: actions/upload-artifact@v7
        with:
          name: xppautX-windows
          retention-days: 14
          path: xppautX.exe
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      # saved even when a check failed or the run was cancelled: the objects the build made are good either way
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-windows-ucrt-gcc-

  # web2check against the Windows build, beside windows-core (as
  # linux-ui is beside linux-core): its own build, the runner's Chrome
  # (tools/cdp.mjs findBrowser; runner-images lists Google Chrome and
  # Microsoft Edge on windows-2025)
  windows-ui:
    name: Windows - GCC UCRT browser UI
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',windows-ui,')
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # windows-ui: 243 compiles, 20 cleanups at 400M (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 500M
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        # the release tags: git describe gives the build the version the
        # update check compares (v0.1.0-N-gHASH), not a bare commit hash
        with:
          fetch-depth: 0
      # the release's UCRT64 gcc, as windows-core; this job's shell stays Git
      # Bash (node from setup-node below), with the toolchain on its PATH
      - uses: ./.github/actions/msys2-toolchain
        with:
          msystem: UCRT64
          packages-file: .github/msys2-ucrt64-packages.txt
      - name: Put the UCRT64 toolchain on the PATH
        run: echo 'C:\msys64\ucrt64\bin' >> "$GITHUB_PATH"
      # its own first: built from Git Bash on the PATH, not the MSYS2 shell, so the core job's objects never hit here (0 of 243 in run 42955421613)
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-windows-ucrt-ui-
          also: ccache-windows-ucrt-gcc-
      - name: Build xppautX.exe
        id: build
        run: mingw32-make -j4 xppautx
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: "New front end in a browser (store and plot state)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/web2check.mjs --bin ./xppautX.exe
      - name: "UI workflow and no-model startup in a browser"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/uiworkflowcheck.mjs ./xppautX.exe && node tools/startupcheck.mjs ./xppautX.exe
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-windows-ucrt-ui-

  # MSYS2's CLANG64 toolchain (W23: clang, libc++, lld, compiler-rt), a
  # second compiler on Windows beside windows-core's UCRT64 gcc (gcc 16), which
  # stays the default build: windows-core's checks against a clang build (into
  # build/clang, dynamically linked: the shell's PATH has libc++'s DLLs),
  # then asancheck.sh with AddressSanitizer + UBSan (--no-leaks: no
  # LeakSanitizer on Windows)
  windows-clang:
    name: Windows - clang core and numerical baselines
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',windows-clang,')
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # windows-clang: 0.3 of 0.4 GB used, no cleanup (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 400M
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      - uses: ./.github/actions/msys2-toolchain
        with:
          msystem: CLANG64
          packages-file: .github/msys2-clang64-packages.txt
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-windows-clang-core-
      - name: "Build xppautX with clang (WERROR default)"
        id: build
        run: |
          clang --version | head -1
          mingw32-make -j4 build/clang/xppautX.exe BUILDDIR=build/clang CC=clang CXX=clang++
      - name: "Unit tests (one program, linked with clang++ and libc++)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mingw32-make -j4 test BUILDDIR=build/clang CC=clang CXX=clang++
      - name: Headless run matches Linux (ignoring line ends)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          top=$PWD
          cd "$(mktemp -d)" && "$top/build/clang/xppautX.exe" "$top/examples/ode/lecar.odex" --silent
          test "$(tr -d '\r' < output.dat | md5sum | cut -d' ' -f1)" = 58fed7a175a635010b7698da91dc4e4c
          "$top/build/clang/xppautX.exe" "$top/examples/ode/lecar.odex" --silent --verbose 2>&1 | grep "Compiled 11 of 11 programs"
      - name: "Command-line modes (--help, --no-open; --browser's ShellExecute skipped)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh tools/modecheck.sh build/clang/xppautX.exe
      # The checks of one binary that touch disjoint parts of it run side by side
      # (tools/side_by_side.sh, W41, W694: a log each, the verdicts at the end, the
      # job fails if any did): the protocol and the front end over HTTP, autoX,
      # every example (Linux's tests/examples.md5, no baseline of its own since
      # W159) and autoX's diagrams against the shared numerical baseline (1 and
      # auto threads, W299). The artifacts below read the files they leave.
      - name: "Protocol, web, autoX, every example and autoX diagrams (run side by side)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bin=build/clang/xppautX.exe
          tools/side_by_side.sh --prefix build/check- \
            servercheck uv run --locked python tools/servercheck.py --server "$bin" -- \
            steadycheck uv run --locked python tools/steadycheck.py --server "$bin" -- \
            spikecheck uv run --locked python tools/spikecheck.py --server "$bin" -- \
            livestatecheck uv run --locked python tools/livestatecheck.py --server "$bin" -- \
            webcheck uv run --locked python tools/webcheck.py --bin "$bin" -- \
            autoxcheck uv run --locked python tools/autoxcheck.py --server "$bin" -- \
            examples tools/examples_check.sh --bin "$bin" --write examples.windows-clang.md5 --keep examples-differ -- \
            autoxcompare uv run --locked python tools/autoxcompare.py --server "$bin" --keep auto-differ
      - name: Upload the examples' md5s (only when a model differs from the baseline)
        if: ${{ !cancelled() && hashFiles('examples-differ/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: examples-md5-windows-clang
          retention-days: 30
          path: |
            examples.windows-clang.md5
            examples-differ/
          if-no-files-found: ignore
      - name: Upload the differing autoX diagrams
        if: ${{ !cancelled() && hashFiles('auto-differ/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: auto-diagrams-windows-clang
          retention-days: 30
          path: auto-differ/
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      # saved even when a check failed or the run was cancelled: the objects the build made are good either way
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-windows-clang-core-

  # windows-clang's sanitizer run, a job of its own so it runs beside
  # windows-clang's checks instead of after them (W36). W41 first split
  # this into a shared-build job plus shards that downloaded it, but the
  # build (57-89s) turned out far cheaper than the artifact round trip and
  # the extra job's own msys2 setup, so each shard now builds for itself
  # (--skip-build stays for local iteration). W181 keeps six shards:
  # smoke+examples, unit tests, protocol+web together, and three autoX
  # partitions selected by their owner. The previous autoX partition 2
  # took 694s in CI 37177097317; combining the short protocol/web jobs
  # offsets the new autoX shard's repeated build. Measure both the matrix
  # critical path and summed runner time before further splitting.
  windows-clang-sanitizers:
    name: Windows - clang sanitizers - ${{ matrix.shard }}
    if: github.event_name != 'workflow_dispatch' || inputs.jobs == '' || contains(format(',{0},', inputs.jobs), ',windows-clang-sanitizers,')
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      # windows-clang-sanitizers: 0.3 of 0.6 GB used; 0.5 leaves room (W716: a cap one job's whole build fits in, so ccache never cleans up mid-run)
      CCACHE_MAXSIZE: 500M
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: examples
            only: build,smoke,examples
          - shard: unittests
            only: build,unittests
          - shard: protocol-and-web
            only: build,servercheck,webcheck
          - shard: auto-1-of-3
            only: build,autoxcheck-shard=1/3
          - shard: auto-2-of-3
            only: build,autoxcheck-shard=2/3
          - shard: auto-3-of-3
            only: build,autoxcheck-shard=3/3
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6.4.3
        with:
          enable-cache: true
      - uses: ./.github/actions/msys2-toolchain
        with:
          msystem: CLANG64
          packages-file: .github/msys2-clang64-packages.txt
      - name: Restore the compiler cache (W692, W716)
        uses: ./.github/actions/ccache-restore
        with:
          prefix: ccache-windows-clang-asan-
      - name: "Sanitizers (ASan + UBSan, no leaks): ${{ matrix.shard }}"
        id: asan
        run: MAKE=mingw32-make tools/asancheck.sh --no-leaks --builddir build/clang-asan --only ${{ matrix.only }} CC=clang CXX=clang++
      - name: Upload the sanitizer reports
        if: ${{ !cancelled() && steps.asan.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: sanitizer-reports-windows-clang-${{ matrix.shard }}
          retention-days: 14
          path: |
            build/clang-asan/reports/
            build/clang-asan-*.log
          if-no-files-found: ignore
      - name: Compiler cache hit rate
        if: ${{ always() }}
        run: ccache --show-stats
      # saved even when a check failed or the run was cancelled: the objects the build made are good either way
      - name: Save the compiler cache, delete the older ones (W716)
        if: ${{ always() && matrix.shard == 'examples' }}
        uses: ./.github/actions/ccache-save
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: ccache-windows-clang-asan-
