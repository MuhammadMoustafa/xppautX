name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Build, smoke test, metrics
        run: tools/verify.sh
      - name: Coupling metric
        run: |
          tools/coredeps.sh -v | tee build/coredeps.out
          test "$(grep -oE 'imports: [0-9]+' build/coredeps.out | grep -oE '[0-9]+')" -eq 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web front end behaviour (against the build)
        run: node tools/webtest.mjs
      - name: "New front end: dist/ built from src/, types, unit tests"
        run: cd web2 && npm ci && npm run check && npm run typecheck && npm test
      - name: "New front end in a browser (store and plot state)"
        run: node tools/web2check.mjs

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build xppautX (X11-free)
        run: make -j"$(sysctl -n hw.ncpu)" xppautx
      - name: "Unit tests (C and C++ objects linked with clang++)"
        run: make test
      - name: Smoke test (headless)
        run: |
          cd /tmp && "$GITHUB_WORKSPACE/xppautX" "$GITHUB_WORKSPACE/examples/ode/lecar.ode" -silent
          test "$(wc -l < output.dat)" -eq 601
          echo "md5 on this platform: $(md5 -q output.dat) (linux baseline c281851de59ffd03b2a46428619a0c8f)"
      - name: Server protocol and web front end
        run: python3 tools/servercheck.py && python3 tools/webcheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: xppaut-macos
          path: xppautX

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          cache: true
          # the gcc package brings g++ too (core/*.cpp)
          install: make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - name: Build the X11-free binaries natively
        run: make -j4 xppautx
      - name: "Unit tests (C and C++ objects linked with g++)"
        run: make test
      - name: Headless run matches Linux (ignoring line ends)
        run: |
          cd /tmp && "$GITHUB_WORKSPACE/xppautX.exe" "$GITHUB_WORKSPACE/examples/ode/lecar.ode" -silent
          test "$(tr -d '\r' < output.dat | md5sum | cut -d' ' -f1)" = c281851de59ffd03b2a46428619a0c8f
      - name: Server protocol and web front end
        run: python tools/servercheck.py --server ./xppautX.exe && python tools/webcheck.py --bin ./xppautX.exe
      - uses: actions/upload-artifact@v4
        with:
          name: xppaut-windows
          path: xppautX.exe
