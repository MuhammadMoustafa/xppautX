name: build

on:
  push:
    branches: [master]
  pull_request:

# Each platform runs the same behaviour checks against its own build
# (build, unit tests, protocol, web, command-line modes, AUTO, every
# example, the browser checks); the checks about the source, the same
# everywhere, run once in `source` (W17). Every job runs in parallel: the
# wall time is the longest job's. Jobs are named for what they test: a
# platform's `-core` job (build, unit tests, protocol, modes, AUTO,
# examples), its `-ui` job (the front end in a headless browser),
# `linux-sanitizers` and `macos-sanitizers` (the latter without
# LeakSanitizer, unsupported on Apple Silicon runners), and `source`.
#
# Every check runs even when an earlier check of its job failed (W18), so
# one run reports every failure (and still uploads the examples' md5s);
# the job still fails if any step did. Setup steps (checkout, toolchain,
# build) keep the default condition: a failed build stops its job's
# checks, which test the build (`steps.build.outcome`).
jobs:
  # the source, not a build: encoding, script modes, stdoutcheck,
  # formatcheck, the LTO type check and the warning count
  # (tools/sourcecheck.sh; tools/verify.sh runs it too, locally), and web2's
  # dist/ built from src/, types and unit tests
  # The new front end driven through a headless browser (docs/ui-v2.md):
  # its own job beside linux-core's verify.sh, so the two run in parallel
  # instead of one after the other (97 s on top of verify's own time).
  # Needs its own build (plain, not the whole verify.sh) and the same
  # WebKitGTK window the checks in verify.sh's build already carry.
  # AddressSanitizer, LeakSanitizer and UBSan over the same checks, in
  # parallel with the jobs above (it takes a few minutes); one step:
  # asancheck.sh builds and runs every check itself
  # AddressSanitizer + UBSan (Apple clang) over the same checks as
  # linux-sanitizers, without LeakSanitizer: unsupported on Apple Silicon
  # runners (asancheck.sh --no-leaks turns off ASAN_OPTIONS'
  # detect_leaks).
  # web2check against the macOS build, beside macos-core (as linux-ui and
  # windows-ui are beside theirs): its own build, the runner's Google
  # Chrome (tools/cdp.mjs findBrowser: /Applications/Google Chrome.app)
  macos-ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build xppautX
        id: build
        run: make -j"$(sysctl -n hw.ncpu)" xppautx
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: "New front end in a browser (store and plot state)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/web2check.mjs

  windows-core:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # windows-2025 (windows-latest, since 2026) already carries a
      # MinGW-w64 UCRT gcc at C:\mingw64 (niXman/mingw-builds-binaries,
      # runner-images' Install-Mingw64.ps1, which also copies
      # mingw32-make.exe to make.exe and adds the dir to the machine
      # PATH; toolsets/toolset-2025.json pins gcc "15.*" / runtime
      # "ucrt", the same ABI CLAUDE.md's local native build targets, if
      # not quite the same gcc release), so no per-run package install
      # is needed; this only extends PATH in case a future image moves
      # or does not machine-wide it. https://github.com/actions/runner-images/blob/main/images/windows/scripts/build/Install-Mingw64.ps1
      # https://github.com/actions/runner-images/blob/main/images/windows/toolsets/toolset-2025.json
      - name: Use the runner's own MinGW-w64 (C:\mingw64); no toolchain install
        run: echo 'C:\mingw64\bin' >> "$GITHUB_PATH"
      - name: Build the X11-free binaries natively
        id: build
        run: make -j4 xppautx
      - name: "Unit tests (C and C++ objects linked with g++), test binaries linked in parallel"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: make -j4 test
      - name: "TEMP: test_io alone"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          ./build/obj/tests/test_io.exe; echo "exit $?"
          ./build/obj/tests/test_io.exe > /tmp/o.txt 2> /tmp/e.txt; echo "exit $?"; tail -5 /tmp/o.txt; tail -5 /tmp/e.txt
          ls "$(cygpath -u "$TEMP")" | head; echo "TEMP=$TEMP TMP=$TMP"
      - name: Headless run matches Linux (ignoring line ends)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cd /tmp && "$GITHUB_WORKSPACE/xppautX.exe" "$GITHUB_WORKSPACE/examples/ode/lecar.ode" -silent
          test "$(tr -d '\r' < output.dat | md5sum | cut -d' ' -f1)" = c281851de59ffd03b2a46428619a0c8f
      - name: Server protocol and web front end
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/servercheck.py --server ./xppautX.exe && python tools/webcheck.py --bin ./xppautX.exe
      - name: "Command-line modes (--help, --no-open; --browser's ShellExecute skipped)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: sh tools/modecheck.sh xppautX.exe
      - name: "AUTO over the protocol (tolerant of libm's last-digit ULP differences, autocheck.py's lines_close)"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/autocheck.py --server ./xppautX.exe
      # tests/examples.windows.md5 when committed, else Linux's
      # tests/examples.md5 in first-run mode (differences reported, not
      # failed); a crash or timeout always fails; output.dat's CRs are
      # removed before hashing (tools/examples_check.sh)
      - name: "Every example: no crash, output md5s against this platform's baseline"
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tools/examples_check.sh --bin xppautX.exe --platform windows --write examples.windows.md5 --keep examples-differ
      # what this run computed, to commit as tests/examples.windows.md5
      # (when Windows differs from Linux, or its numerics change on purpose)
      - name: Upload the examples' md5s
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: examples-md5-windows
          path: |
            examples.windows.md5
            examples-differ/
          if-no-files-found: ignore
      - name: Strip the CI artifact (local/-g builds are untouched)
        run: strip xppautX.exe
      - uses: actions/upload-artifact@v7
        with:
          name: xppaut-windows
          path: xppautX.exe

  # web2check against the Windows build, beside windows-core (as
  # linux-ui is beside linux-core): its own build, the runner's Chrome
  # (tools/cdp.mjs findBrowser; runner-images lists Google Chrome and
  # Microsoft Edge on windows-2025)
  # MSYS2's CLANG64 toolchain (W23: clang, libc++, lld, compiler-rt), a
  # third compiler on Windows beside windows-core's MinGW gcc, which stays
  # the default build: windows-core's checks against a clang build (into
  # build/clang, dynamically linked: the shell's PATH has libc++'s DLLs),
  # then asancheck.sh with AddressSanitizer + UBSan (--no-leaks: no
  # LeakSanitizer on Windows)
