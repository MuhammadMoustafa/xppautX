name: release

# Tagging v* builds the X11-free programs for each platform and attaches them,
# with the source (GPL v2), to the GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (a dry run when the release does not exist)'
        required: false

permissions:
  contents: write

# the release's name: the tag pushed or the tag asked for; empty on a dry run
# of a branch, where the Makefile and package_release.sh use git describe
env:
  XPP_VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: "Source archive (GPL v2: the binaries' exact source)"
        run: |
          name="xppautX-${XPP_VERSION:-$(git describe --tags --always)}-source"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: xppautX-*-source.tar.gz*

  linux:
    # the runner CI builds on (its gcc 13 has std::format; 22.04's gcc 11
    # does not): the binary needs glibc 2.39 or newer (maintainer,
    # 2026-09-28: Ubuntu 22.04 need not be supported)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      # the runner image (ubuntu24, ubuntu26 ...) in the cache's key: ImageOS is
      # an environment variable of the runner, not in the workflow's env context
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      - name: Cache WebKitGTK apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-v1
          restore-keys: apt-webkit2gtk-4.1-dev-${{ steps.image.outputs.os }}-
      # the window's library is built against WebKitGTK and embedded;
      # xppautX itself does not need it to start (W13e)
      - name: WebKitGTK for the desktop window
        # apt downloads into ~/apt-cache (the runner's user can restore a cache
        # there, not into /var/cache/apt), then leaves it readable for the save
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" libwebkit2gtk-4.1-dev
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - name: Build
        run: make -j4 xppautx WINDOW=1 RELEASE=1
      - name: Check
        run: |
          python3 tools/servercheck.py
          python3 tools/webcheck.py
          sh tools/modecheck.sh
          # the release flags (RELEASE=1) must not change the numerics
          tools/examples_check.sh
      # package_release.sh strips the archived binary (debug info out of
      # the download); this build itself is untouched
      - name: Package
        run: tools/package_release.sh linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            xppautX-*-*.tar.gz*
            xppautX-*-*.deb*
      # the .deb installs (dependencies resolved) and its program starts
      - name: Install the .deb
        run: |
          sudo apt-get install -y ./xppautX-*-linux-x64.deb
          xppautX --version
          test -f /usr/share/applications/xppautx.desktop

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      # zip has no pre-installed equivalent on the runner (7zip's -tzip
      # differs from package_release.sh's `zip`), so this job keeps MSYS2
      # rather than the bare runner toolchain build.yml's windows-core job
      # uses; release: false reuses the image's own MSYS2 install
      # (C:\msys64) instead of downloading one
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          install: make zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - name: Build
        run: make -j4 xppautx RELEASE=1
      - name: Check
        run: |
          python tools/servercheck.py --server ./xppautX.exe
          python tools/webcheck.py --bin ./xppautX.exe
          tools/examples_check.sh --bin xppautX.exe --platform windows
      # package_release.sh strips the archived binary; this build itself
      # is untouched
      - name: Package
        run: tools/package_release.sh windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            xppautX-*.zip*
            xppautX-*.exe*

  macos:
    # the window (WKWebView) is on by default since W13d (CI builds
    # it); a user has run the app on a Mac (2026-09-28). The
    # binaries are unsigned, so macOS asks the user to allow them
    # (Gatekeeper). Signing and notarizing need an Apple account.
    strategy:
      matrix:
        include:
          # macos-14's Apple clang has no -std=c++23
          # md5: the examples baseline (tests/examples.<md5>.md5); Intel has
          # none, so it only reports differences from Linux's (a crash fails)
          - runner: macos-15
            arch: macos-arm64
            md5: macos
          - runner: macos-15-intel
            arch: macos-x64
            md5: macos-x64
    runs-on: ${{ matrix.runner }}
    env:
      # the oldest macOS the binaries run on, not the runner's own: 13.3
      # is the first whose libc++ has floating-point to_chars (std::format)
      MACOSX_DEPLOYMENT_TARGET: '13.3'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build
        run: make -j3 xppautx RELEASE=1
      - name: Check
        run: |
          python3 tools/servercheck.py
          python3 tools/webcheck.py
          tools/examples_check.sh --platform ${{ matrix.md5 }}
      - name: Package
        run: tools/package_release.sh ${{ matrix.arch }}
      # the .app inside the .dmg starts (double-clicking a .ode is not
      # checked: see README)
      - name: Check the .dmg
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/xppdmg xppautX-*-${{ matrix.arch }}.dmg
          /tmp/xppdmg/xppautX.app/Contents/MacOS/xppautX --version
          hdiutil detach /tmp/xppdmg
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}
          path: |
            xppautX-*-*.tar.gz*
            xppautX-*-*.dmg*

  publish:
    needs: [source, linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Attach everything to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*/*
          body: |
            xppautX for Linux, Windows and macOS: one program, no X11.

            `xppautX model.ode` opens the front end in a window of its own:
            on Windows (WebView2, part of Windows 10/11), on macOS (the
            system's WKWebView) and on Linux where WebKitGTK 4.1 is
            installed (elsewhere it says what to install and uses your
            browser); nothing else is needed. `-silent` runs it headlessly
            and writes output.dat, as upstream xppaut does; `--server`
            speaks the JSON protocol on stdin/stdout. `linux-x64` needs
            glibc 2.39 or newer (Ubuntu 24.04, Debian 13, Fedora 40 and
            later). `macos-arm64` is for Apple silicon Macs, `macos-x64` for
            Intel Macs, macOS 13.3 or newer. The macOS and
            Windows binaries are not signed, so the system asks you to
            allow them the first time (macOS: `xattr -dr
            com.apple.quarantine` on the unpacked folder, or right-click >
            Open; Windows: SmartScreen's "More info" > "Run anyway").

            GPL v2, as upstream XPPAUT (Bard Ermentrout). The source of these
            binaries is the attached `*-source.tar.gz`.
