name: release

# Tagging v* builds the X11-free programs for each platform and attaches them,
# with the source (GPL v2), to the GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (a dry run when the release does not exist)'
        required: false

permissions:
  contents: write

# the release's name: the tag pushed or the tag asked for; empty on a dry run
# of a branch, where the Makefile and package_release.sh use git describe
env:
  XPP_VERSION: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: "Source archive (GPL v2: the binaries' exact source)"
        run: |
          name="xppautX-${XPP_VERSION:-$(git describe --tags --always)}-source"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" HEAD
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: xppautX-*-source.tar.gz*

  linux:
    # an older runner so the binaries also run on older distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      # the window's library is built against WebKitGTK and embedded;
      # xppautX itself does not need it to start (W13e)
      - name: WebKitGTK for the desktop window
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: Build
        run: make -j4 xppautx WINDOW=1
      - name: Check
        run: |
          python3 tools/servercheck.py
          python3 tools/webcheck.py
          sh tools/modecheck.sh
      - name: Package
        run: tools/package_release.sh linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: xppautX-*-*.tar.gz*

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make zip mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
      - name: Build
        run: make -j4 xppautx
      - name: Check
        run: |
          python tools/servercheck.py --server ./xppautX.exe
          python tools/webcheck.py --bin ./xppautX.exe
      - name: Package
        run: tools/package_release.sh windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: xppautX-*.zip*

  macos:
    # the window (WKWebView) is on by default since W13d (CI builds and runs
    # it here); nobody has tried an archive from this job by hand yet. The
    # binaries are unsigned, so macOS asks the user to allow them
    # (Gatekeeper). Signing and notarizing need an Apple account.
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: macos-arm64
          - runner: macos-15-intel
            arch: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build
        run: make -j3 xppautx
      - name: Check
        run: |
          python3 tools/servercheck.py
          python3 tools/webcheck.py
      - name: Package
        run: tools/package_release.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}
          path: xppautX-*-*.tar.gz*

  publish:
    needs: [source, linux, windows, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Attach everything to the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*/*
          body: |
            xppautX for Linux, Windows and macOS: one program, no X11.

            `xppautX model.ode` opens the front end in a window of its own:
            on Windows (WebView2, part of Windows 10/11), on macOS (the
            system's WKWebView) and on Linux where WebKitGTK 4.1 is
            installed (elsewhere it says what to install and uses your
            browser); nothing else is needed. `-silent` runs it headlessly
            and writes output.dat, as upstream xppaut does; `--server`
            speaks the JSON protocol on stdin/stdout. `macos-arm64` is for
            Apple silicon Macs, `macos-x64` for Intel Macs. The macOS and
            Windows binaries are not signed, so the system asks you to
            allow them the first time (macOS: `xattr -dr
            com.apple.quarantine` on the unpacked folder, or right-click >
            Open; Windows: SmartScreen's "More info" > "Run anyway").

            GPL v2, as upstream XPPAUT (Bard Ermentrout). The source of these
            binaries is the attached `*-source.tar.gz`.
