# W417 (#479): the Python the comparison studies (docs/comparison-machine.md) and tools/autox-profile
# need beyond the standard library, locked in uv.lock so the laptop and the comparison machine run the
# same versions. Not a package. The repository's own checks (servercheck, autoxcheck, ...) use the
# standard library plus numpy (autoxcompare, via autoxcheck and servercheck) and run through `uv run --locked python`.
[project]
name = "xppautx-comparison"
version = "0"
description = "Python dependencies of the xppautX comparison studies"
requires-python = ">=3.14"
dependencies = [
    "numpy",       # paper/benchmarks/plots.py, tools/python-integration (W427, #489), tools/exportcheck.py (W766, #846)
    "matplotlib",  # paper/benchmarks/plots.py
    "mpmath",      # tools/autox-profile/eig_accuracy.py
    "scipy",       # tools/python-integration/scipy_integrate.py: DOP853, the accuracy reference (W427, #489)
    "pillow",      # tools/make_icons.py
    # tools/exportcheck.py: the exported python_numba script (W766, #846); llvmlite has no macOS Intel wheel, and the
    # release's Intel Mac checks (servercheck, webcheck, examples) need no numba
    "numba; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[tool.uv]
package = false

# W268 (#325): the GPU probes (paper/benchmarks/gpu/) compile CUDA C with NVRTC and launch it through CuPy's RawKernel: pip wheels
# only, no CUDA toolkit or nvcc. Not in the default groups: `uv run --locked python` is unchanged; the probes run with
# `uv run --locked --group gpu python`. The NVRTC and runtime wheels are held to 13.2.x, the CUDA version the driver (595) reports,
# which a newer runtime wheel would exceed.
[dependency-groups]
gpu = [
    "cupy-cuda13x",
    "nvidia-cuda-nvrtc<13.3",
    "nvidia-cuda-runtime<13.3",
]
